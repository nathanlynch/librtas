name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [powerpc64le, powerpc64]
    env:
      TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v2
    - name: toolchain-setup
      run: ./tools/toolchain-setup
    - name: build
      run: ./tools/ci-build
