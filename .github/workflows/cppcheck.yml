name: cppcheck

# Controls when the workflow will run.
on:
  # This allows the build to be triggered manually via the github UI.
  workflow_dispatch:

  # Push to any branch
  push:

  # Any pull request
  pull_request:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2

    - name: Install cppcheck
      run: |
        sudo apt update
        sudo apt install -y cppcheck

    - name: Run cppcheck
      run: cppcheck --enable=warning,performance,portability,style --error-exitcode=1 .
